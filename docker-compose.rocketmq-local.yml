# Standalone local/CI broker for Java processes on the host. Never use as a production overlay.
name: takeout-rocketmq-local
services:
  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "127.0.0.1:19876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  rocketmq-store-init:
    image: apache/rocketmq:5.5.0
    user: '0:0'
    restart: on-failure
    command: ["sh", "-ec", "chown rocketmq:rocketmq /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store

  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    restart: unless-stopped
    # Host-side Java clients must receive a reachable loopback Broker address.
    command:
      - sh
      - -ec
      - |
        sed 's/^brokerIP1=.*/brokerIP1=127.0.0.1/' /home/rocketmq/broker.conf > /tmp/broker-local.conf
        exec sh mqbroker -c /tmp/broker-local.conf
    ports:
      - "127.0.0.1:10911:10911"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=256m"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-store-init:
        condition: service_completed_successfully
    volumes:
      - ./server/docker/rocketmq-broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  rocketmq-init:
    image: apache/rocketmq:5.5.0
    restart: on-failure
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    environment:
      JAVA_OPT_EXT: "-Xms64m -Xmx128m"
      TAKEOUT_ROCKETMQ_TOPIC: ${TAKEOUT_ROCKETMQ_TOPIC:-takeout-domain-events}
      TAKEOUT_ROCKETMQ_CONSUMER_GROUP: ${TAKEOUT_ROCKETMQ_CONSUMER_GROUP:-takeout-notifications}
    volumes:
      - ./server/docker/rocketmq-init.sh:/home/rocketmq/takeout-init.sh:ro
    command: ["sh", "/home/rocketmq/takeout-init.sh"]

volumes:
  rocketmq-store:
