springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

takeout:
  data-seed:
    enabled: false
  payment:
    mock-enabled: false
    real-enabled: ${TAKEOUT_PAYMENT_REAL_ENABLED:true}
  sms:
    provider: ${TAKEOUT_SMS_PROVIDER:qq-email}
    expose-mock-code: ${TAKEOUT_SMS_EXPOSE_MOCK_CODE:false}
    daily-limit: ${TAKEOUT_SMS_DAILY_LIMIT:5}
    hourly-limit: ${TAKEOUT_SMS_HOURLY_LIMIT:100}
  demo:
    signup-balance: 0
  upload:
    provider: ${TAKEOUT_UPLOAD_PROVIDER:obs}
    local-enabled: false
  security:
    rate-limit:
      enabled: true
  cache:
    enabled: true
  mq:
    enabled: true
