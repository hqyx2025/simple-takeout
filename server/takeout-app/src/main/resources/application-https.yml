server:
  port: ${TAKEOUT_HTTPS_PORT:8443}
  ssl:
    enabled: true
    key-store: ${TAKEOUT_TLS_KEYSTORE}
    key-store-password: ${TAKEOUT_TLS_KEYSTORE_PASSWORD}
    key-store-type: ${TAKEOUT_TLS_KEYSTORE_TYPE:PKCS12}
    key-alias: ${TAKEOUT_TLS_KEY_ALIAS}

spring:
  config:
    activate:
      on-profile: https
