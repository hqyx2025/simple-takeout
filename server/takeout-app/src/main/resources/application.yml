server:
  # 8080 位于 Windows 当前排除端口范围（8005-8104）内，改用未排除的 9000
  # 默认值不变：单跑应用（本机开发、既有脚本、compose）仍是 9000。
  # 与网关同机同跑时把应用挪开（如 TAKEOUT_APP_PORT=9100），由网关占住对外的 9000。
  port: ${TAKEOUT_APP_PORT:9000}

spring:
  application:
    name: simple-takeout-server
  datasource:
    # 主机/端口可用环境变量覆盖：本机开发默认 localhost:3306，
    # 容器编排（docker-compose）下指向服务名 mysql:3306
    url: jdbc:mysql://${TAKEOUT_DB_HOST:localhost}:${TAKEOUT_DB_PORT:3306}/takeout?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${TAKEOUT_DB_USERNAME:root}
    password: ${TAKEOUT_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      # 图文评价图片上传上限（单张 5MB）
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ssz
    time-zone: GMT+8
  data:
    redis:
      host: ${TAKEOUT_REDIS_HOST:127.0.0.1}
      port: ${TAKEOUT_REDIS_PORT:6379}
      password: ${TAKEOUT_REDIS_PASSWORD:}
      database: ${TAKEOUT_REDIS_DATABASE:0}
      # 短超时 + 关闭自动重连：Redis 故障时立刻回源数据库（实测单请求 ~550ms，而非默认重试下的 ~10s）
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 16
          max-idle: 8
          # 预热连接，避免首个请求承担建连开销（冷启动首请求约 150ms 属正常）
          min-idle: 2
          max-wait: 200ms

# 自定义配置
takeout:
  jwt:
    # HS256 密钥（生产环境请通过环境变量注入）
    secret: ${TAKEOUT_JWT_SECRET:simple-takeout-jwt-secret-key-please-change-2026}
    expire-hours: 72
  security:
    rate-limit:
      # 登录/注册按来源 IP 限流（计数存 Redis，多实例共享、重启不丢）；
      # Redis 不可用时放行，绝不因为限流把正常用户挡在门外
      enabled: ${TAKEOUT_RATE_LIMIT_ENABLED:true}
  cache:
    # 热点数据缓存总开关；Redis 不可用时写缓存/失效为尽力而为，读缓存异常自动回源数据库
    enabled: ${TAKEOUT_CACHE_ENABLED:true}
    # 缓存键前缀（多环境共用同一 Redis 时用它隔离）
    key-prefix: ${TAKEOUT_CACHE_PREFIX:takeout:}
    # 基础 TTL（秒）：实际 TTL = 基础值 + [0, jitter) 随机秒数，防止同一时刻批量过期（缓存雪崩）
    ttl-seconds: ${TAKEOUT_CACHE_TTL_SECONDS:300}
    jitter-seconds: ${TAKEOUT_CACHE_JITTER_SECONDS:120}
    # 空值占位 TTL（秒）：用于缓存穿透保护，明显短于正常 TTL
    null-ttl-seconds: ${TAKEOUT_CACHE_NULL_TTL_SECONDS:60}
    # 缓存击穿保护：回源期间对同一 key 加分布式互斥锁，等待锁释放的最长毫秒数
    rebuild-lock-ms: ${TAKEOUT_CACHE_REBUILD_LOCK_MS:3000}
    rebuild-wait-ms: ${TAKEOUT_CACHE_REBUILD_WAIT_MS:500}
  mq:
    # 领域事件（事务性 Outbox + Redis Stream）总开关；关闭后不写事件表、不投递
    enabled: ${TAKEOUT_MQ_ENABLED:true}
    # Stream 最大长度（近似裁剪，防止无限增长）
    stream-maxlen: ${TAKEOUT_MQ_STREAM_MAXLEN:10000}
    # Outbox 中继扫描间隔（毫秒）与首次延迟
    relay-scan-ms: ${TAKEOUT_MQ_RELAY_SCAN_MS:2000}
    relay-initial-ms: 10000
    outbox-batch-size: ${TAKEOUT_MQ_BATCH_SIZE:100}
    # 多实例行级认领的租约时长（毫秒）：认领后实例崩溃，该行要等租约过期才被其他实例接手
    claim-lease-ms: ${TAKEOUT_MQ_CLAIM_LEASE_MS:30000}
    # 单条事件最大投递重试次数，超过后保留记录但不再重试（便于排查）
    max-retry: ${TAKEOUT_MQ_MAX_RETRY:10}
    # 已投递事件的保留小时数与清理间隔
    retain-hours: ${TAKEOUT_MQ_RETAIN_HOURS:72}
    cleanup-scan-ms: 3600000
    cleanup-initial-ms: 60000
    # 消费端：批量大小、扫描间隔与幂等去重键保留小时数
    consumer-batch: ${TAKEOUT_MQ_CONSUMER_BATCH:20}
    consumer-scan-ms: ${TAKEOUT_MQ_CONSUMER_SCAN_MS:2000}
    consumer-initial-ms: 15000
    dedup-hours: ${TAKEOUT_MQ_DEDUP_HOURS:24}
  order:
    # 待付款支付时限（分钟）：超时由 OrderTimeoutJob 自动取消并回滚库存/优惠券
    pay-timeout-minutes: ${TAKEOUT_PAY_TIMEOUT_MINUTES:15}
    # 超时扫描间隔与首次延迟（毫秒）
    timeout-scan-ms: 60000
    timeout-scan-initial-ms: 30000
  job:
    # 定时任务单实例调度锁总开关。仅消除多实例重复扫描的浪费，不承担正确性
    # （正确性由条件更新与 Outbox 租约保证）；Redis 不可用时一律放行执行（fail-open）
    lock-enabled: ${TAKEOUT_JOB_LOCK_ENABLED:true}
    # 超时扫描锁 TTL（毫秒）
    timeout-lock-ttl-ms: ${TAKEOUT_JOB_TIMEOUT_LOCK_TTL_MS:120000}
    # Outbox 清理锁 TTL（毫秒）
    cleanup-lock-ttl-ms: ${TAKEOUT_JOB_CLEANUP_LOCK_TTL_MS:300000}
  upload:
    # 评价图片本地存储目录（相对启动工作目录）；通过 /uploads/** 对外访问
    dir: ${TAKEOUT_UPLOAD_DIR:uploads}
