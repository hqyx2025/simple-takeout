server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/takeout-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://hqyx.website/takeout$request_uri;
    }
}

# Redirect legacy HTTPS bookmarks to the canonical domain.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/takeout-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takeout-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Permissions-Policy "geolocation=(self)" always;

    location / {
        return 308 https://hqyx.website/takeout$request_uri;
    }
}
