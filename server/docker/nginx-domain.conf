# Canonical entry; Docker upstreams bind to loopback ports 9080 / 9087.
log_format takeout_privacy '$time_iso8601 method=$request_method uri=$uri status=$status bytes=$body_bytes_sent duration=$request_time request_id=$request_id';
server_tokens off;
limit_req_zone $binary_remote_addr zone=takeout_upload_read:10m rate=30r/s;
server {
    listen 80;
    server_name hqyx.website www.hqyx.website;
    location /.well-known/acme-challenge/ {
        root /var/www/takeout-acme;
        default_type text/plain;
    }
    location / { return 301 https://hqyx.website$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.hqyx.website;
    add_header Strict-Transport-Security "max-age=7776000; includeSubDomains" always;
    ssl_certificate /etc/letsencrypt/live/blog-hqyx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-hqyx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://hqyx.website$request_uri;
}

server {
    listen 443 ssl;
    server_name hqyx.website;
    ssl_certificate /etc/letsencrypt/live/blog-hqyx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-hqyx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=7776000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /takeout {
        access_log /var/log/nginx/takeout-access.log takeout_privacy;
        return 308 /takeout/$is_args$args;
    }
    location /takeout/ {
        access_log /var/log/nginx/takeout-access.log takeout_privacy;
        proxy_pass http://127.0.0.1:9087/;
    }
    location /takeout/uploads/ {
        limit_req zone=takeout_upload_read burst=60 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/takeout-access.log takeout_privacy;
        proxy_pass http://127.0.0.1:9087/uploads/;
    }
    location / {
        proxy_pass http://127.0.0.1:9080;
    }
}

# Preserve old bookmarks without keeping visitors on ports or numeric hosts.
server {
    listen 8080;
    server_name _;
    return 308 https://hqyx.website$request_uri;
}

server {
    listen 8087;
    server_name _;
    location = /takeout { return 308 https://hqyx.website/takeout/$is_args$args; }
    location /takeout/ { return 308 https://hqyx.website$request_uri; }
    location / { return 308 https://hqyx.website/takeout$request_uri; }
}
