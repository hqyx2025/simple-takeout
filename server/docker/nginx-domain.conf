# Canonical entry; Docker upstreams bind to loopback ports 9080 / 9087.
server {
    listen 80;
    server_name hqyx.website www.hqyx.website;
    location /.well-known/acme-challenge/ {
        root /var/www/takeout-acme;
        default_type text/plain;
    }
    location / { return 301 https://hqyx.website$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.hqyx.website;
    ssl_certificate /etc/letsencrypt/live/blog-hqyx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-hqyx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://hqyx.website$request_uri;
}

server {
    listen 443 ssl;
    server_name hqyx.website;
    ssl_certificate /etc/letsencrypt/live/blog-hqyx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-hqyx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Permissions-Policy "geolocation=(self)" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /takeout { return 308 /takeout/$is_args$args; }
    location /takeout/ {
        proxy_pass http://127.0.0.1:9087/;
    }
    location / {
        proxy_pass http://127.0.0.1:9080;
    }
}

# Preserve old bookmarks without keeping visitors on ports or numeric hosts.
server {
    listen 8080;
    server_name _;
    return 308 https://hqyx.website$request_uri;
}

server {
    listen 8087;
    server_name _;
    location = /takeout { return 308 https://hqyx.website/takeout/$is_args$args; }
    location /takeout/ { return 308 https://hqyx.website$request_uri; }
    location / { return 308 https://hqyx.website/takeout$request_uri; }
}
