log_format takeout_upstream_privacy '$time_iso8601 method=$request_method uri=$uri status=$status bytes=$body_bytes_sent duration=$request_time request_id=$request_id';
server {
    listen 8087;
    access_log /var/log/nginx/access.log takeout_upstream_privacy;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        proxy_pass http://takeout_apps;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_next_upstream off;
        client_max_body_size 6m;
    }
}
upstream takeout_apps {
    resolver 127.0.0.11 valid=5s ipv6=off;
    zone takeout_apps 64k;
    server app:8087 resolve;
}
