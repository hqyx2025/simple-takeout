# Included inside the HTTPS server. The web release has its own atomic symlink.
location = /takeout {
    return 308 /takeout/$is_args$args;
}
location = /takeout/health {
    proxy_pass http://127.0.0.1:9087/health;
}
location ^~ /takeout/api/ {
    access_log /var/log/nginx/takeout-access.log takeout_privacy;
    proxy_pass http://127.0.0.1:9087/api/;
}
location ^~ /takeout/uploads/ {
    limit_req zone=takeout_upload_read burst=60 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/takeout-access.log takeout_privacy;
    proxy_pass http://127.0.0.1:9087/uploads/;
}
location ~ ^/takeout/(?:.*/)?\. {
    return 404;
}
location /takeout/ {
    alias /var/www/takeout/web-current/;
    index index.html;
    autoindex off;
    open_file_cache off;
    access_log /var/log/nginx/takeout-access.log takeout_privacy;
    # Repeat inherited HTTPS headers: nginx add_header overrides the parent set.
    add_header Strict-Transport-Security "max-age=7776000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-cache always;
    add_header X-Takeout-Web independent always;
}
