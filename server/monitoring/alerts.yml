groups:
  - name: takeout
    rules:
      - alert: TakeoutTargetDown
        expr: up{job="takeout"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Service metrics unavailable: {{ $labels.instance }}'
      - alert: TakeoutHttpP95Slow
        expr: histogram_quantile(0.95, sum by (le, application, instance) (rate(http_server_requests_seconds_bucket{job="takeout",uri!~"/actuator.*|/health"}[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'HTTP P95 exceeds one second: {{ $labels.instance }}'
      - alert: TakeoutHttpServerErrors
        expr: sum by (instance) (rate(http_server_requests_seconds_count{job="takeout",status=~"5.."}[5m])) / clamp_min(sum by (instance) (rate(http_server_requests_seconds_count{job="takeout"}[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'HTTP 5xx exceeds five percent: {{ $labels.instance }}'
      - alert: TakeoutDatabasePoolWaiting
        expr: hikaricp_connections_pending{job="takeout"} > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Database pool has waiting requests: {{ $labels.instance }}'
      - alert: TakeoutOutboxDelayed
        expr: takeout_outbox_oldest_age_seconds{job="takeout"} > 300
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Oldest undelivered event exceeds five minutes: {{ $labels.instance }}'
      - alert: TakeoutOutboxCollectorUnavailable
        expr: takeout_outbox_collector_available{job="takeout"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Outbox backlog is unknown: {{ $labels.instance }}'
