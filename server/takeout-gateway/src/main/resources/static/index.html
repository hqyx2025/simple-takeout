<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e65d2f">
  <title>简单外卖</title>
  <style>
    :root{--paper:#fffaf4;--surface:#fff;--ink:#33251f;--muted:#806f65;--line:#ead8c8;--accent:#e65d2f;--accent-dark:#b94520;--green:#337960;--red:#b83d31;--shadow:0 8px 24px rgba(94,53,29,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .topbar{height:64px;position:sticky;top:0;z-index:10;background:rgba(255,250,244,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.topinner{height:100%;max-width:1440px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.mark{width:34px;height:34px;display:grid;place-items:center;color:#fff;background:var(--accent);border-radius:10px}.mark svg{width:21px;height:21px}.top-actions{display:flex;align-items:center;gap:8px}.user-meta{color:var(--muted);font-size:13px;margin-right:8px}
    .layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 64px)}.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:#fffdf9}.nav-caption{padding:10px 11px 7px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}.nav-list{display:grid;gap:3px}.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--muted)}.nav-item:hover,.nav-item.active{background:#fff0e5;color:var(--accent-dark);font-weight:700}.nav-icon{width:19px;text-align:center;font-size:16px}.main{min-width:0;padding:28px clamp(16px,3vw,42px) 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:21px}.page-head h1{margin:0;font-size:26px;line-height:1.2}.page-head p{margin:6px 0 0;color:var(--muted)}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{position:fixed;right:20px;bottom:20px;z-index:30;max-width:min(440px,calc(100vw - 40px));padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}.notice.error{border-color:#e5b4ae;color:var(--red)}.notice[hidden]{display:none}
    .btn{min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:background .15s,border .15s}.btn:hover{background:#fff2e7;border-color:#e5b99a}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.btn.primary:hover{background:var(--accent-dark)}.btn.danger{color:var(--red);border-color:#e9c0bb}.btn.small{min-height:30px;padding:0 9px;font-size:12px}.btn.icon{width:36px;padding:0;font-size:16px}.btn:disabled{opacity:.5;cursor:not-allowed}.input,.select,.textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:none}.textarea{min-height:90px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,93,47,.1)}label.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar .input{max-width:340px}.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:9px;background:#fffdf9}.tab{padding:7px 11px;border:0;border-radius:6px;background:transparent;color:var(--muted)}.tab.active{background:#fff0e5;color:var(--accent-dark);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.section{margin-top:22px}.section-title{margin:0 0 12px;font-size:16px}.surface{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.metric{padding:17px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.metric-label{color:var(--muted);font-size:12px}.metric-value{margin-top:6px;font-size:25px;font-weight:800}.metric-note{margin-top:3px;color:var(--muted);font-size:12px}.store-card{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:box-shadow .15s,transform .15s}.store-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.store-image{height:116px;display:grid;place-items:center;overflow:hidden;background:#fff0df;color:var(--accent-dark);font-size:22px}.store-image img,.food-image img{width:100%;height:100%;object-fit:cover}.store-body{padding:14px}.store-body h3{margin:0 0 5px;font-size:16px}.subtle{color:var(--muted);font-size:12px}.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{padding:3px 7px;border-radius:5px;background:#fff2e7;color:#895236;font-size:11px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{color:var(--accent-dark);font-weight:800}.food-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #f0e6de}.food-row:last-child{border-bottom:0}.food-image{width:76px;height:66px;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:#fff0df;color:var(--accent-dark)}.food-info{min-width:0}.food-info h3{margin:0 0 4px;font-size:15px}.food-info p{margin:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.food-actions{display:flex;align-items:center;gap:7px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 12px;border-bottom:1px solid #f0e6de;text-align:left;vertical-align:middle}th{background:#fffdf9;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}td{font-size:13px}tr:last-child td{border-bottom:0}.td-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.status{display:inline-flex;padding:3px 8px;border-radius:20px;background:#f5eee8;color:#6c5b51;font-size:11px;white-space:nowrap}.status.good{background:#e9f4ed;color:#337960}.status.warn{background:#fff2df;color:#a7651b}.status.bad{background:#fcece9;color:#ad493c}.empty{padding:40px 18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);text-align:center;background:rgba(255,255,255,.4)}.order-card,.item-card{padding:15px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.order-card+.order-card,.item-card+.item-card{margin-top:10px}.order-items{padding:10px 0;color:var(--muted);font-size:12px}.muted-sep{height:1px;margin:11px 0;background:#f0e6de}.address-option{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.address-option.selected{border-color:var(--accent);background:#fff8f2}.address-option label{display:flex;gap:9px;align-items:start}.inline-form{padding:16px;margin:12px 0;border:1px solid var(--line);border-radius:9px;background:#fffdf9}.inline-form[hidden]{display:none}.help-text{margin:5px 0 0;color:var(--muted);font-size:12px}.notice-line{padding:12px 14px;border:1px solid #efd3b7;border-radius:8px;background:#fff4e7;color:#7b4a2c}
    .modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(38,27,21,.42)}.modal[hidden]{display:none}.dialog{width:min(470px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:23px;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 24px 70px rgba(51,37,31,.26)}.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}.dialog-head h2{margin:0;font-size:20px}.field-stack{display:grid;gap:12px}.page-panel{padding:17px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}}@media(max-width:680px){.topinner{padding:0 12px}.layout{display:block}.sidebar{position:sticky;top:64px;z-index:8;padding:7px 9px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav-caption{display:none}.nav-list{display:flex;width:max-content;gap:5px}.nav-item{width:auto;padding:8px 10px;white-space:nowrap}.nav-icon{display:none}.main{padding:20px 13px 50px}.page-head h1{font-size:22px}.grid,.grid.two,.grid.four{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.user-meta{display:none}.food-row{grid-template-columns:60px minmax(0,1fr)}.food-image{width:60px;height:58px}.food-actions{grid-column:2;justify-content:flex-end}.top-actions .btn{min-height:34px;padding:0 9px}.hide-mobile{display:none}}
    @media(prefers-color-scheme:dark){:root{--paper:#211a16;--surface:#2b211c;--ink:#fff6ed;--muted:#c5afa0;--line:#4b372b;--shadow:0 8px 24px rgba(0,0,0,.2)}.topbar{background:rgba(33,26,22,.96)}.sidebar{background:#261e19}.nav-item:hover,.nav-item.active,.tab.active{background:#493126;color:#f5a17d}.btn{background:#2b211c}.btn:hover{background:#493126}.input,.select,.textarea,.address-option{background:#30251e}.toolbar .tabs,.tabs{background:#261e19}.tag{background:#493126;color:#f0c5a1}.metric,.surface,.order-card,.item-card,.table-wrap{background:#2b211c}.notice-line{color:#f0c5a1;background:#3b2a20;border-color:#664532}.status.good{background:#263c30;color:#a9d7b9}.status.warn{background:#49351f;color:#f0c581}.status.bad{background:#472a26;color:#e7a79d}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topinner">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 10.5h14l-1 8H6l-1-8Z"/><path d="M8 10.5 9.5 6h5L16 10.5M9 14h.01M12 14h.01M15 14h.01" stroke-linecap="round"/><path d="M4 10.5h16"/></svg></span>简单外卖</a>
    <div class="top-actions"><span class="user-meta" id="userMeta">共享服务端</span><button class="btn" id="topCart" hidden>购物车 <b id="cartCount">0</b></button><button class="btn" id="topLogin">登录</button><button class="btn" id="topLogout" hidden>退出</button></div>
  </div></header>
  <div class="layout"><aside class="sidebar"><div class="nav-caption" id="navCaption">浏览</div><nav class="nav-list" id="nav"></nav></aside><main class="main" id="app"><div class="empty">正在载入…</div></main></div>
  <div class="notice" id="notice" hidden></div>
  <div class="modal" id="authModal" hidden><div class="dialog"><div class="dialog-head"><div><h2 id="authTitle">登录</h2><p class="help-text">网页与手机端共用同一账号和服务端数据。</p></div><button class="btn icon" data-close="authModal" aria-label="关闭">×</button></div><form id="authForm" class="field-stack"></form></div></div>
  <script src="/app.js?v=20261019-manual-address" defer></script>
</body>
</html>
