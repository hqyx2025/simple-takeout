server:
  # 8080 位于 Windows 当前排除端口范围（8005-8104）内，改用未排除的 9000
  port: 9000

spring:
  application:
    name: simple-takeout-server
  datasource:
    url: jdbc:mysql://localhost:3306/takeout?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${TAKEOUT_DB_USERNAME:root}
    password: ${TAKEOUT_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ssz
    time-zone: GMT+8

# 自定义配置
takeout:
  jwt:
    # HS256 密钥（生产环境请通过环境变量注入）
    secret: ${TAKEOUT_JWT_SECRET:simple-takeout-jwt-secret-key-please-change-2026}
    expire-hours: 72
