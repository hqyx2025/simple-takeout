server:
  port: 8080

spring:
  application:
    name: simple-takeout-server
  datasource:
    url: jdbc:mysql://localhost:3306/takeout?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 自定义配置
takeout:
  jwt:
    # HS256 密钥（生产环境请通过环境变量注入）
    secret: jiandan-waimai-simple-takeout-jwt-secret-2026-32bytes!
    expire-hours: 72
