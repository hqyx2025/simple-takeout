server:
  # 8080 位于 Windows 当前排除端口范围（8005-8104）内，改用未排除的 9000
  port: 9000

spring:
  application:
    name: simple-takeout-server
  datasource:
    # 主机/端口可用环境变量覆盖：本机开发默认 localhost:3306，
    # 容器编排（docker-compose）下指向服务名 mysql:3306
    url: jdbc:mysql://${TAKEOUT_DB_HOST:localhost}:${TAKEOUT_DB_PORT:3306}/takeout?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${TAKEOUT_DB_USERNAME:root}
    password: ${TAKEOUT_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      # 图文评价图片上传上限（单张 5MB）
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ssz
    time-zone: GMT+8
  data:
    redis:
      host: ${TAKEOUT_REDIS_HOST:127.0.0.1}
      port: ${TAKEOUT_REDIS_PORT:6379}
      password: ${TAKEOUT_REDIS_PASSWORD:}
      database: ${TAKEOUT_REDIS_DATABASE:0}
      # 短超时 + 关闭自动重连：Redis 故障时立刻回源数据库（实测单请求 ~550ms，而非默认重试下的 ~10s）
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 16
          max-idle: 8
          # 预热连接，避免首个请求承担建连开销（冷启动首请求约 150ms 属正常）
          min-idle: 2
          max-wait: 200ms

# 自定义配置
takeout:
  jwt:
    # HS256 密钥（生产环境请通过环境变量注入）
    secret: ${TAKEOUT_JWT_SECRET:simple-takeout-jwt-secret-key-please-change-2026}
    expire-hours: 72
  cache:
    # 热点数据缓存总开关；Redis 不可用时写缓存/失效为尽力而为，读缓存异常自动回源数据库
    enabled: ${TAKEOUT_CACHE_ENABLED:true}
    # 缓存键前缀（多环境共用同一 Redis 时用它隔离）
    key-prefix: ${TAKEOUT_CACHE_PREFIX:takeout:}
    # 基础 TTL（秒）：实际 TTL = 基础值 + [0, jitter) 随机秒数，防止同一时刻批量过期（缓存雪崩）
    ttl-seconds: ${TAKEOUT_CACHE_TTL_SECONDS:300}
    jitter-seconds: ${TAKEOUT_CACHE_JITTER_SECONDS:120}
    # 空值占位 TTL（秒）：用于缓存穿透保护，明显短于正常 TTL
    null-ttl-seconds: ${TAKEOUT_CACHE_NULL_TTL_SECONDS:60}
    # 缓存击穿保护：回源期间对同一 key 加分布式互斥锁，等待锁释放的最长毫秒数
    rebuild-lock-ms: ${TAKEOUT_CACHE_REBUILD_LOCK_MS:3000}
    rebuild-wait-ms: ${TAKEOUT_CACHE_REBUILD_WAIT_MS:500}
  order:
    # 待付款支付时限（分钟）：超时由 OrderTimeoutJob 自动取消并回滚库存/优惠券
    pay-timeout-minutes: ${TAKEOUT_PAY_TIMEOUT_MINUTES:15}
    # 超时扫描间隔与首次延迟（毫秒）
    timeout-scan-ms: 60000
    timeout-scan-initial-ms: 30000
  upload:
    # 评价图片本地存储目录（相对启动工作目录）；通过 /uploads/** 对外访问
    dir: ${TAKEOUT_UPLOAD_DIR:uploads}
