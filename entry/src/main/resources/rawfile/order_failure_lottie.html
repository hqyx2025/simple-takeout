<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单提交失败</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #animation {
      width: 120px;
      height: 120px;
    }

    #fallback {
      display: flex;
      width: 96px;
      height: 96px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f44336;
      color: #ffffff;
      font: 64px Arial, sans-serif;
      line-height: 96px;
    }
  </style>
</head>
<body>
  <div id="animation"></div>
  <div id="fallback">×</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    const failureAnimation = {
      v: '5.7.15',
      fr: 30,
      ip: 0,
      op: 60,
      w: 160,
      h: 160,
      nm: 'order-failure',
      ddd: 0,
      assets: [],
      layers: [
        {
          ddd: 0,
          ind: 1,
          ty: 4,
          nm: 'failure-mark',
          sr: 1,
          ks: {
            o: { a: 0, k: 100 },
            r: { a: 0, k: 0 },
            p: { a: 0, k: [80, 80, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: {
              a: 1,
              k: [
                { t: 0, s: [0, 0, 100], e: [100, 100, 100] },
                { t: 12, s: [100, 100, 100] },
                { t: 60, s: [100, 100, 100] }
              ]
            }
          },
          ao: 0,
          shapes: [
            {
              ty: 'gr',
              nm: 'red-circle',
              it: [
                { ty: 'el', p: { a: 0, k: [0, 0] }, s: { a: 0, k: [112, 112] }, nm: 'circle' },
                { ty: 'fl', c: { a: 0, k: [0.9569, 0.2627, 0.2118, 1] }, o: { a: 0, k: 100 }, r: 1, nm: 'fill' },
                { ty: 'tr', p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } }
              ]
            },
            {
              ty: 'gr',
              nm: 'cross-left',
              it: [
                { ty: 'rc', d: 1, p: { a: 0, k: [0, 0] }, r: { a: 0, k: 5 }, s: { a: 0, k: [12, 58] }, nm: 'bar' },
                { ty: 'fl', c: { a: 0, k: [1, 1, 1, 1] }, o: { a: 0, k: 100 }, r: 1, nm: 'fill' },
                { ty: 'tr', p: { a: 0, k: [-20, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: -45 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } }
              ]
            },
            {
              ty: 'gr',
              nm: 'cross-right',
              it: [
                { ty: 'rc', d: 1, p: { a: 0, k: [0, 0] }, r: { a: 0, k: 5 }, s: { a: 0, k: [12, 58] }, nm: 'bar' },
                { ty: 'fl', c: { a: 0, k: [1, 1, 1, 1] }, o: { a: 0, k: 100 }, r: 1, nm: 'fill' },
                { ty: 'tr', p: { a: 0, k: [20, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 45 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } }
              ]
            }
          ],
          ip: 0,
          op: 60,
          st: 0,
          bm: 0
        }
      ]
    };

    const fallback = document.getElementById('fallback');
    try {
      if (window.lottie) {
        window.lottie.loadAnimation({
          container: document.getElementById('animation'),
          renderer: 'svg',
          loop: false,
          autoplay: true,
          animationData: failureAnimation
        });
        fallback.style.display = 'none';
      }
    } catch (_) {
      fallback.style.display = 'flex';
    }
  </script>
</body>
</html>
