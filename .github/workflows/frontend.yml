name: Frontend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'entry/**'
      - 'AppScope/**'
      - '*.json5'
      - '*.ts'
      - 'oh-package.json5'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build:
    # The runner is a personal Windows machine: only trusted master pushes or manual runs.
    runs-on: [self-hosted, Windows, DevEco]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure DevEco toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $devEco = if ($env:DEVECO_HOME) { $env:DEVECO_HOME } else { 'C:\Program Files\Huawei\DevEco Studio' }
          foreach ($tool in @('tools\node\node.exe', 'tools\ohpm\bin\ohpm.bat', 'tools\hvigor\bin\hvigorw.js', 'sdk')) {
            if (-not (Test-Path -LiteralPath (Join-Path $devEco $tool))) { throw "Missing DevEco tool: $tool" }
          }
          "DEVECO_HOME=$devEco" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DEVECO_SDK_HOME=$(Join-Path $devEco 'sdk')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $devEco 'tools\node') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $devEco 'tools\ohpm\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install HarmonyOS dependencies
        run: |
          & (Join-Path $env:DEVECO_HOME 'tools\ohpm\bin\ohpm.bat') install --all --strict_ssl true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned HAP
        run: |
          $devEco = if ($env:DEVECO_HOME) { $env:DEVECO_HOME } else { 'C:\Program Files\Huawei\DevEco Studio' }
          $env:DEVECO_SDK_HOME = Join-Path $devEco 'sdk'
          & (Join-Path $devEco 'tools\node\node.exe') `
            (Join-Path $devEco 'tools\hvigor\bin\hvigorw.js') `
            --mode module -p module=entry@default -p product=default `
            -p requiredDeviceType=phone assembleHap --analyze=normal --parallel --incremental --daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run script checks
        run: |
          Get-ChildItem scripts -Filter '*.cjs' | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload unsigned debug HAP
        uses: actions/upload-artifact@v4
        with:
          name: entry-unsigned-debug-hap
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 7
