name: Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TAKEOUT_MYSQL_CONCURRENCY_TEST: '1'
      TAKEOUT_DB_HOST: 127.0.0.1
      TAKEOUT_DB_PORT: '3310'
      TAKEOUT_DB_USERNAME: root
      TAKEOUT_DB_PASSWORD: ci-test
      TAKEOUT_TEST_REDIS_PORT: '6387'
      TAKEOUT_MANAGEMENT_PORT: '0'
      TAKEOUT_ROCKETMQ_TEST: '1'
      TAKEOUT_ROCKETMQ_NAMESRV_ADDR: localhost:19876
      TAKEOUT_ROCKETMQ_TOPIC: takeout-ci-domain-events
      TAKEOUT_ROCKETMQ_CONSUMER_GROUP: takeout-ci-notifications
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6387:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate monitoring rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/server/monitoring:/rules:ro" -w /rules prom/prometheus:v3.16.0 test rules alerts.test.yml
      - name: Start isolated RocketMQ
        run: |
          docker run --rm --entrypoint sh -v "$PWD/server/docker:/case:ro" apache/rocketmq:5.5.0 /case/rocketmq-init.test.sh
          docker compose -f docker-compose.rocketmq-local.yml up -d rocketmq-init
          docker compose -f docker-compose.rocketmq-local.yml wait rocketmq-init
      - name: Run backend tests
        run: |
          export TAKEOUT_PERSONAL_DATA_ENCRYPTION_SECRET="$(openssl rand -base64 32)"
          export TAKEOUT_PERSONAL_DATA_INDEX_SECRET="$(openssl rand -base64 32)"
          date +%s > test-started.txt
          mvn -f server/pom.xml --batch-mode --no-transfer-progress verify
      - name: Require executed tests without skips
        if: always()
        run: |
          python3 scripts/backend-evidence.test.py
          python3 scripts/backend-evidence.py --since "$(cat test-started.txt)" --minimum-line-coverage 0.70 --output TemporaryCacheStorage/backend-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            TemporaryCacheStorage/backend-summary.json
            server/**/target/surefire-reports/TEST-*.xml
            server/**/target/site/jacoco/**
            server/takeout-coverage/target/site/jacoco-aggregate/**
          if-no-files-found: error
      - name: Stop isolated RocketMQ
        if: always()
        run: docker compose -f docker-compose.rocketmq-local.yml down -v
