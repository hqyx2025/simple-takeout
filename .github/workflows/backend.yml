name: Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
      - 'scripts/backend-evidence.py'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
      - 'scripts/backend-evidence.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TAKEOUT_MYSQL_CONCURRENCY_TEST: '1'
      TAKEOUT_DB_HOST: 127.0.0.1
      TAKEOUT_DB_PORT: '3310'
      TAKEOUT_DB_USERNAME: root
      TAKEOUT_DB_PASSWORD: ci-test
      TAKEOUT_TEST_REDIS_PORT: '6387'
      TAKEOUT_MANAGEMENT_PORT: '0'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6387:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend tests
        run: |
          export TAKEOUT_PERSONAL_DATA_ENCRYPTION_SECRET="$(openssl rand -base64 32)"
          export TAKEOUT_PERSONAL_DATA_INDEX_SECRET="$(openssl rand -base64 32)"
          date +%s > test-started.txt
          mvn -f server/pom.xml --batch-mode --no-transfer-progress verify
      - name: Require executed tests without skips
        if: always()
        run: |
          python3 scripts/backend-evidence.test.py
          python3 scripts/backend-evidence.py --since "$(cat test-started.txt)" --minimum-line-coverage 0.70 --output TemporaryCacheStorage/backend-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            TemporaryCacheStorage/backend-summary.json
            server/**/target/surefire-reports/TEST-*.xml
            server/**/target/site/jacoco/**
            server/takeout-coverage/target/site/jacoco-aggregate/**
          if-no-files-found: error
