name: Backend

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TAKEOUT_MYSQL_CONCURRENCY_TEST: '1'
      TAKEOUT_DB_HOST: 127.0.0.1
      TAKEOUT_DB_PORT: '3310'
      TAKEOUT_DB_USERNAME: root
      TAKEOUT_DB_PASSWORD: ci-test
      TAKEOUT_TEST_REDIS_PORT: '6387'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6387:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend tests
        run: mvn -f server/pom.xml --batch-mode --no-transfer-progress test
